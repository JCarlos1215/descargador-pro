<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPM Studio — Descargador Pro</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #16161a;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #2d2d35;
            --input-bg: #1f1f23;
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background: var(--bg-color); 
            color: var(--text-primary);
            margin: 0; 
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: -100px;
            right: -100px;
            z-index: -1;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -150px;
            left: -150px;
            z-index: -1;
        }

        .card { 
            background: var(--card-bg); 
            padding: 2.5rem; 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px var(--border-color); 
            text-align: center; 
            width: min(450px, calc(100vw - 2rem)); 
            backdrop-filter: blur(10px);
        }

        .brand-logo {
            display: block;
            width: min(100%, 340px);
            height: 250px;
            object-fit: contain;
            margin: 0 auto 0.5rem;
        }

        h2 { 
            font-size: 1.8rem; 
            font-weight: 700; 
            margin-bottom: 0.5rem; 
            letter-spacing: -0.025em;
            background: linear-gradient(to bottom right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p { 
            color: var(--text-secondary); 
            font-size: 0.95rem; 
            margin-bottom: 2rem; 
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        input, select { 
            width: 100%; 
            padding: 12px 16px; 
            background: var(--input-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            color: white; 
            font-size: 1rem;
            box-sizing: border-box; 
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus, select:focus { 
            border-color: var(--accent-color); 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button { 
            background: var(--accent-color); 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            border-radius: 12px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 1rem; 
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        button:hover { 
            background: var(--accent-hover); 
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4);
        }

        button:active { 
            transform: translateY(0);
        }

        button:disabled { 
            background: #334155; 
            color: #94a3b8; 
            cursor: not-allowed; 
            box-shadow: none;
            transform: none;
        }

        #status { 
            margin-top: 1.5rem; 
            font-size: 0.875rem; 
            color: var(--text-secondary); 
            min-height: 1.2rem;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }

        .loader {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="brand-logo" src="logo.png" alt="Off The Wall">
        <p>Descargador de Audio y Video Profesional</p>
        
        <div class="input-group">
            <input type="text" id="url" placeholder="Pega el enlace de YouTube, SoundCloud, etc...">
            <select id="format">
                <option value="mp4">Video (MP4)</option>
                <option value="mp3">Audio (MP3)</option>
            </select>
        </div>

        <button id="btn">Descargar Archivo</button>
        <div id="status" role="status" aria-live="polite">Listo para procesar</div>
    </div>

    <script>
        document.getElementById('btn').onclick = async () => {
            const url = document.getElementById('url').value.trim();
            const format = document.getElementById('format').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('btn');

            if(!url) return alert("Por favor, ingresa un enlace válido.");

            status.innerHTML = '<span class="loader"></span> Analizando enlace...';
            btn.disabled = true;

            try {
                const response = await fetch('https://descargador-pro-co95.onrender.com/download', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ url, format })
                });

                if (response.ok) {
                    status.innerHTML = '<span class="loader"></span> Descargando archivo...';
                    const blob = await response.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    const disposition = response.headers.get('Content-Disposition') || '';
                    const filename = disposition.match(/filename="?([^";]+)"?/i);
                    a.download = filename ? filename[1] : `archivo.${format}`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(() => window.URL.revokeObjectURL(downloadUrl), 60000);
                    status.innerText = "✓ Descarga completada con éxito";
                } else {
                    const error = await response.json().catch(() => null);
                    let msg = error?.error || "Error desconocido";
                    if (msg.includes("verificar la sesión") || msg.includes("sign in") || msg.includes("blocked")) {
                        msg = "YouTube bloqueó la descarga. El servidor necesita cookies actualizadas para continuar.";
                    }
                    status.innerText = "✕ " + (response.status === 504
                        ? "El servidor tardó demasiado. Intenta con un archivo más corto."
                        : msg);
                }
            } catch (e) {
                status.innerText = "✕ Error de conexión con el servidor";
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
